<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter un projet — Anoor's Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @layer base {
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #0F172A;
        color: #F1F5F9;
      }
    }
  </style>
</head>
<body>

  <!-- Chargement de la navigation et du footer -->
  <script>
    function fetchHtmlFragment(url) {
      return fetch(url)
        .then(response => {
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          return response.text();
        })
        .then(html => {
          const match = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
          return match ? match[1] : html;
        });
    }

    fetchHtmlFragment('../shared/nav.html')
      .then(data => document.body.insertAdjacentHTML('afterbegin', data))
      .catch(err => console.error('Erreur chargement nav :', err));

    fetchHtmlFragment('../shared/footer.html')
      .then(data => document.body.insertAdjacentHTML('beforeend', data))
      .catch(err => console.error('Erreur chargement footer :', err));
  </script>

  <main class="max-w-3xl mx-auto px-4 py-10">

    <!-- Lien retour -->
    <a href="list-project.html"
       class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-sm mb-6">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Retour aux projets
    </a>

    <div class="bg-white shadow-xl rounded-3xl border border-slate-200 overflow-hidden">
      <form id="form-projet" class="p-8 space-y-6" novalidate>

        <h2 id="form-titre" class="text-3xl font-bold text-slate-900">Ajouter un projet</h2>

        <!-- Titre -->
        <div>
          <label for="titre" class="block text-sm font-semibold text-slate-700 mb-1">
            Titre du projet <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="titre"
            name="titre"
            placeholder="Ex: Application de Dashboard"
            class="block w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder:text-slate-400 transition">
          <p id="erreur-titre" class="hidden mt-1.5 text-xs text-red-500 font-medium"></p>
        </div>

        <!-- Description -->
        <div>
          <label for="description" class="block text-sm font-semibold text-slate-700 mb-1">
            Description <span class="text-red-500">*</span>
          </label>
          <textarea
            id="description"
            name="description"
            rows="4"
            placeholder="Décrivez brièvement le projet, ses fonctionnalités et ses objectifs…"
            class="block w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder:text-slate-400 transition resize-none"></textarea>
          <p id="erreur-description" class="hidden mt-1.5 text-xs text-red-500 font-medium"></p>
        </div>

        <!-- Catégorie -->
        <div>
          <label for="categorie" class="block text-sm font-semibold text-slate-700 mb-1">Catégorie</label>
          <select
            id="categorie"
            name="categorie"
            class="block w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   bg-white transition">
            <option value="Web App">Web App</option>
            <option value="E-commerce">E-commerce</option>
            <option value="Mobile">Mobile</option>
            <option value="API / Backend">API / Backend</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <!-- Technologies -->
        <div>
          <label for="technologies" class="block text-sm font-semibold text-slate-700 mb-1">
            Technologies utilisées
          </label>
          <input
            type="text"
            id="technologies"
            name="technologies"
            placeholder="HTML, CSS, JavaScript, React…"
            class="block w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder:text-slate-400 transition">
          <p class="mt-1 text-xs text-slate-400">Séparez les technologies par des virgules.</p>
        </div>

        <!-- Image -->
        <div>
          <label for="image" class="block text-sm font-semibold text-slate-700 mb-1">Image du projet</label>

          <!-- Prévisualisation -->
          <img
            id="preview-image"
            src=""
            alt="Prévisualisation de l'image"
            class="hidden w-full h-48 object-cover rounded-xl border border-slate-200 mb-3">

          <input
            type="file"
            id="image"
            name="image"
            accept="image/*"
            class="block w-full text-sm text-slate-500
                   file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0
                   file:text-sm file:font-semibold file:bg-blue-600 file:text-white
                   hover:file:bg-blue-700 file:transition-colors file:cursor-pointer cursor-pointer">
          <p class="mt-1 text-xs text-slate-400">PNG, JPG, GIF — stockée localement dans le navigateur.</p>
        </div>

        <!-- GitHub -->
        <div>
          <label for="github" class="block text-sm font-semibold text-slate-700 mb-1">
            Lien GitHub
          </label>
          <input
            type="url"
            id="github"
            name="github"
            placeholder="https://github.com/username/projet"
            class="block w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder:text-slate-400 transition">
        </div>

        <!-- Site web -->
        <div>
          <label for="website" class="block text-sm font-semibold text-slate-700 mb-1">
            Lien du site web
          </label>
          <input
            type="url"
            id="website"
            name="website"
            placeholder="https://mon-projet.com"
            class="block w-full rounded-lg border border-slate-300 px-4 py-2.5 text-slate-900 text-sm
                   focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
                   placeholder:text-slate-400 transition">
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-4 pt-2">
          <button
            type="submit"
            id="btn-submit"
            class="inline-flex items-center gap-2 px-6 py-2.5 bg-blue-600 text-white text-sm font-semibold
                   rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500
                   focus:ring-offset-2 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            Ajouter le projet
          </button>
          <a href="list-project.html"
             class="text-sm text-slate-500 hover:text-slate-700 transition-colors font-medium">
            Annuler
          </a>
        </div>

      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/projects-store.js"></script>
  <script src="../js/add-project.js"></script>

</body>
</html>
